# nginx de vuelos.siviajo.com → HUB (Next.js, PM2 `hub` :3001, VPS 148.230.72.17).
#
# Instalación en el VPS (después de que el A record apunte acá):
#   cp ops/nginx/vuelos.siviajo.com.conf /etc/nginx/sites-available/vuelos.siviajo.com
#   ln -s /etc/nginx/sites-available/vuelos.siviajo.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d vuelos.siviajo.com     # agrega el bloque SSL solo
#
# Este archivo es solo HTTP: certbot reescribe el server block y agrega el
# 443 con los certificados. No hace falta tocar nada más a mano después.
# Ya instalado en el VPS (2026-09-09); falta correr certbot (requiere DNS).

server {
    listen 80;
    listen [::]:80;
    server_name vuelos.siviajo.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
