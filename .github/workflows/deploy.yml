name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy build to VPS
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            .next/ root@${{ secrets.VPS_HOST }}:/opt/hub/.next/

          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            public/ root@${{ secrets.VPS_HOST }}:/opt/hub/public/

          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            package.json package-lock.json \
            root@${{ secrets.VPS_HOST }}:/opt/hub/

      - name: Install deps & restart PM2
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} \
            "cd /opt/hub && npm ci --omit=dev --prefer-offline && pm2 restart hub"
